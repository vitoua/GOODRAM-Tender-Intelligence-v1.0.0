{% extends 'base.html' %}{% block c %}<h1>{{t.cpv}}</h1><form method="post" action="/cpv/update" class="panel"><div class="cpv-table"><b>{{t.code}}</b><b>{{t.name}}</b><b>{{t.active}}</b>{% for x in rows %}<input name="code" value="{{x.code}}"><input name="name" value="{{x.name}}"><label><input type="checkbox" name="active" value="{{x.code}}" {% if x.active %}checked{% endif %}></label>{% endfor %}</div><button>{{t.save}}</button></form><form method="post" action="/cpv/add" class="panel inline"><input name="code" placeholder="CPV" required><input name="name" placeholder="{{t.name}}" required><label><input type="checkbox" name="active" checked>{{t.active}}</label><button>{{t.add}}</button></form>{% endblock %}
