{% extends 'base.html' %}{% block c %}<h1>{{t.analytics_title}}</h1><form class="filters"><select name="country"><option value="">{{t.country}}</option>{% for c in countries %}<option {% if c==country %}selected{% endif %}>{{c}}</option>{% endfor %}</select><select name="source"><option value="">{{t.source}}</option>{% for s in sources %}<option {% if s==source %}selected{% endif %}>{{s}}</option>{% endfor %}</select><input type="date" name="date_from" value="{{date_from}}"><input type="date" name="date_to" value="{{date_to}}"><button>{{t.filter}}</button></form><div class="kpis"><div><b>{{count}}</b><span>{{t.tenders}}</span></div><div><b>{{data.countries|length}}</b><span>{{t.countries}}</span></div><div><b>{{data.sources|length}}</b><span>{{t.sources_nav}}</span></div></div><div class="charts"><article><canvas id="country"></canvas></article><article><canvas id="source"></canvas></article><article><canvas id="cpv"></canvas></article><article><canvas id="days"></canvas></article></div><article><h2>{{t.top_buyers}}</h2>{% for k,v in data.buyers.items() %}<p>{{k}} <b>{{v}}</b></p>{% endfor %}</article>{% endblock %}{% block scripts %}<script>const D={{data|tojson}};function chart(id,type,obj){new Chart(document.getElementById(id),{type:type,data:{labels:Object.keys(obj),datasets:[{data:Object.values(obj),backgroundColor:['#e30613','#111','#777','#b9000b','#e85b63','#444']}]},options:{responsive:true,plugins:{legend:{display:type==='doughnut'}}}})}chart('country','bar',D.countries);chart('source','doughnut',D.sources);chart('cpv','bar',D.cpv);chart('days','line',D.days);</script>{% endblock %}
